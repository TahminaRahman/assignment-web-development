<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Section</title>
  <body>

    <div class="support-section">
      <div class="overlay"></div>
      <div class="content">
        <h1>I need Support</h1>
        <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry.</p>
        <div class="form-box">
          <input type="text" placeholder="Suggest me any feedback for me">
          <button class="btn-press">Submit</button>
        </div>
      </div>
    </div>
  
 
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .support-section {
      background: url('./images/banner.jpg') no-repeat center center/cover;
      width: 90%;
      max-width: 800px;
      height: 250px;
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    .content h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .content p {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .form-box {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box input {
      padding: 10px;
      border-radius: 8px 0 0 8px;
      border: none;
      width: 250px;
      outline: none;
    }

    .form-box button {
      padding: 10px 20px;
      border: none;
      border-radius: 0 8px 8px 0;
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .form-box button:hover {
      background: #ddd;
    }
    .btn-press{
      height: 30px;
      width: 50px;
      color: black;
    }
  </style>
</head>
</body>
</html>
